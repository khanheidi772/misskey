name: Storybook
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=7168
    steps:
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG event=%s repo=%s ref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF"
        PR_NUM='${{ toJSON(github.event.number) }}'
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        printf 'GERALT_DBG pr_number=%s head_repo=%s\n' "$PR_NUM" "$HEAD_REPO"
      continue-on-error: true
    - uses: actions/checkout@v6.0.2
      if: github.event_name == 'pull_request_target'
      with:
        fetch-depth: 0
        submodules: true
        ref: refs/pull/${{ github.event.number }}/merge
    - name: Checkout actual HEAD
      if: github.event_name == 'pull_request_target'
      run: git checkout "$(git rev-list --parents -n1 HEAD | cut -d" " -f3)"
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm i --frozen-lockfile
    - name: Build dependent packages
      run: pnpm -F misskey-js -F misskey-bubble-game -F misskey-reversi build
    - name: Build storybook
      run: pnpm --filter frontend build-storybook
    - name: Publish to Chromatic
      if: github.event_name != 'pull_request_target' && github.ref != 'refs/heads/master'
      id: chromatic_push
      run: |
        DIFF="${{ github.event.before }} HEAD"
        if [ "$DIFF" = "0000000000000000000000000000000000000000 HEAD" ]; then
          DIFF="HEAD"
        fi
        CHROMATIC_PARAMETER="$(node packages/frontend/.storybook/changes.js $(git diff-tree --no-commit-id --name-only -r $(echo "$DIFF") | xargs))"
        if [ "$CHROMATIC_PARAMETER" = " --skip" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
        if pnpm --filter frontend chromatic -d storybook-static $(echo "$CHROMATIC_PARAMETER"); then
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "success=false" >> $GITHUB_OUTPUT
        fi
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG sink_reached event=%s ref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF"
        printf 'GERALT_DBG head_sha=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        printf 'GERALT_DBG head_oneline=%s\n' "$(git log -1 --oneline 2>/dev/null || echo unknown)"
        CHANGES_FILE=packages/frontend/.storybook/changes.js
        if [ -f "$CHANGES_FILE" ]; then
          echo "GERALT_DBG changes.js present"; head -c 2000 "$CHANGES_FILE" || true; echo
        else
          echo "GERALT_DBG changes.js absent"
        fi
      continue-on-error: true
    - name: Publish to Chromatic
      if: github.event_name == 'pull_request_target'
      id: chromatic_pull_request
      run: |
        CHROMATIC_PARAMETER="$(node packages/frontend/.storybook/changes.js $(git diff --name-only origin/${GITHUB_BASE_REF}...origin/${GITHUB_HEAD_REF} | xargs))"
        if [ "$CHROMATIC_PARAMETER" = " --skip" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
        BRANCH="${{ github.event.pull_request.head.user.login }}:$GITHUB_HEAD_REF"
        if [ "$BRANCH" = "misskey-dev:$GITHUB_HEAD_REF" ]; then
          BRANCH="$GITHUB_HEAD_REF"
        fi
        pnpm --filter frontend chromatic --exit-once-uploaded -d storybook-static --branch-name "$BRANCH" $(echo "$CHROMATIC_PARAMETER")
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    - name: Notify that Chromatic detects changes
      uses: actions/github-script@v8.0.0
      if: github.event_name != 'pull_request_target' && steps.chromatic_push.outputs.success == 'false'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: 'Chromatic detects changes. Please [review the changes on Chromatic](https://www.chromatic.com/builds?appId=6428f7d7b962f0b79f97d6e4).'
          })
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    - develop
  pull_request_target:
    branches-ignore:
    - master
